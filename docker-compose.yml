services:
  engine:
    build:
      context: .
      target: base
    command:
      - python
      - -m
      - thericher_v2.ops.daily_report
      - --print-summary
    environment:
      THERICHER_MODE: off
      PYTHONPATH: /app/src
    volumes:
      - thericher-v2-runtime:/app/runtime
      - ./reports:/app/reports

  web:
    build:
      context: .
      target: base
    command:
      - python
      - -m
      - thericher_v2.dashboard.server
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    environment:
      THERICHER_MODE: off
      THERICHER_DASHBOARD_TOKEN: ${THERICHER_DASHBOARD_TOKEN:-}
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - thericher-v2-runtime:/app/runtime

  research:
    build:
      context: .
      target: research
    profiles: ["research"]
    gpus: all
    command:
      - python
      - -m
      - thericher_v2.ops.daily_report
      - --print-summary
    environment:
      THERICHER_MODE: off
      PYTHONPATH: /app/src
      NVIDIA_VISIBLE_DEVICES: all
      THERICHER_MODEL_ARTIFACT_ROOT: ${THERICHER_MODEL_ARTIFACT_ROOT:-/app/model_artifacts}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - ./data:/app/data
      - ./reports:/app/reports
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

volumes:
  thericher-v2-runtime:
