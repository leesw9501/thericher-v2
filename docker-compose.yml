services:
  engine:
    build:
      context: .
      target: base
    command:
      - python
      - -m
      - thericher_v2.ops.daily_report
      - --print-summary
    environment:
      THERICHER_MODE: off
      THERICHER_REPO_ROOT: /app
      THERICHER_MARKET_DATA_ROOT: /app/market_data
      THERICHER_RUNTIME_STATUS: /app/runtime/operator_status.json
      PYTHONPATH: /app/src
    volumes:
      # An explicitly invoked engine/local-simulation job may write this named runtime.
      # The default daily-report command does not produce local-paper events.
      - thericher-v2-runtime:/app/runtime
      - ./reports:/app/reports
      - ./NEXT_CODEX_GOAL.md:/app/NEXT_CODEX_GOAL.md:ro
      - ./agents:/app/agents:ro
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro

  web:
    build:
      context: .
      target: base
    command:
      - python
      - -m
      - thericher_v2.dashboard.server
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --emergency-state
      - /app/emergency/emergency_state.json
      - --execution-control
      - /app/emergency/paper_execution_control.json
      - --paper-account-snapshot
      - /app/runtime/state/paper_account_snapshot.json
      - --paper-canary-runtime
      - /app/runtime/state/kis_paper_canary.json
      - --market-data-freshness
      - /app/runtime/state/kis_paper_intraday_freshness.json
    environment:
      THERICHER_MODE: off
      THERICHER_DASHBOARD_TOKEN: ${THERICHER_DASHBOARD_TOKEN:-}
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # This monitor reads Docker-local state and writes emergency state separately.
      - thericher-v2-runtime:/app/runtime:ro
      - thericher-v2-web-emergency:/app/emergency

  research:
    build:
      context: .
      target: research
    profiles: ["research"]
    network_mode: none
    read_only: true
    gpus: all
    tmpfs:
      - /tmp
    command:
      - python
      - -m
      - thericher_v2.ops.daily_report
      - --print-summary
    environment:
      THERICHER_MODE: off
      THERICHER_REPO_ROOT: /app
      THERICHER_MARKET_DATA_ROOT: /app/market_data
      THERICHER_RUNTIME_STATUS: /app/runtime/operator_status.json
      PYTHONPATH: /app/src
      NVIDIA_VISIBLE_DEVICES: all
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      THERICHER_MODEL_ARTIFACT_ROOT: ${THERICHER_MODEL_ARTIFACT_ROOT:-/app/model_artifacts}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - ./data:/app/data
      - ./reports:/app/reports
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./NEXT_CODEX_GOAL.md:/app/NEXT_CODEX_GOAL.md:ro
      - ./agents:/app/agents:ro
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-intraday-observation:
    build:
      context: .
      target: base
    profiles: ["kis-paper-intraday-head"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    command:
      - python
      - scripts/run_kis_intraday_prospective_observation.py
    environment:
      THERICHER_MODE: off
      THERICHER_REPO_ROOT: /app
      THERICHER_MARKET_DATA_ROOT: /app/market_data
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-readonly:
    build:
      context: .
      target: base
    profiles: ["kis-readonly"]
    command:
      - python
      - -m
      - thericher_v2.execution.kis_paper_console_bridge
      - --execute
      - --repository-root
      - /app
      - --runtime-snapshot
      - /app/runtime/state/paper_account_snapshot.json
    environment:
      THERICHER_MODE: off
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-canary:
    build:
      context: .
      target: base
    profiles: ["kis-paper-canary"]
    command:
      - python
      - -m
      - thericher_v2.execution.kis_paper_canary
      - --execute
      - --cancel-after-submit
      - --repository-root
      - /app
      - --state-root
      - /app/private/canary
      - --runtime-projection
      - /app/runtime/state/kis_paper_canary.json
      - --paper-account-snapshot
      - /app/runtime/state/paper_account_snapshot.json
      - --emergency-state
      - /app/emergency/emergency_state.json
      - --execution-control
      - /app/emergency/paper_execution_control.json
      - --artifact-root
      - /app/model_artifacts
    environment:
      THERICHER_MODE: kis_paper
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - thericher-v2-paper-canary-private:/app/private
      - thericher-v2-web-emergency:/app/emergency
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-session:
    build:
      context: .
      target: base
    profiles: ["kis-paper-session"]
    command:
      - python
      - -m
      - thericher_v2.execution.kis_paper_session
      - --execute
      - --cancel-after-submit
      - --repository-root
      - /app
      - --state-root
      - /app/private/canary
      - --runtime-projection
      - /app/runtime/state/kis_paper_canary.json
      - --paper-account-snapshot
      - /app/runtime/state/paper_account_snapshot.json
      - --emergency-state
      - /app/emergency/emergency_state.json
      - --execution-control
      - /app/emergency/paper_execution_control.json
      - --artifact-root
      - /app/model_artifacts
    environment:
      THERICHER_MODE: kis_paper
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - thericher-v2-paper-canary-private:/app/private
      - thericher-v2-web-emergency:/app/emergency
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-daily-backfill:
    build:
      context: .
      target: base
    profiles: ["kis-paper-daily-backfill"]
    command:
      - python
      - scripts/backfill_kis_paper_market_data_catchup.py
      - --execute
      - --cache-root
      - /app/market_data/us_equities/kis_paper_private/daily
      - --repository-root
      - /app
      - --max-chunks
      - "48"
      - --max-runtime-seconds
      - "21600"
    environment:
      THERICHER_MODE: off
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
    volumes:
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data

  kis-paper-daily-spy-head:
    build:
      context: .
      target: base
    profiles: ["kis-paper-daily-spy-head"]
    command:
      - python
      - scripts/collect_kis_paper_daily_spy_head.py
      - --execute
      - --cache-root
      - /app/market_data/us_equities/kis_paper_private/daily-head/v1
      - --repository-root
      - /app
    environment:
      THERICHER_MODE: off
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
    volumes:
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data

  kis-paper-daily-spy-session:
    build:
      context: .
      target: base
    profiles: ["kis-paper-daily-spy-session"]
    command:
      - python
      - -m
      - thericher_v2.execution.kis_paper_daily_spy_session
      - --execute
      - --repository-root
      - /app
      - --cache-root
      - /app/market_data/us_equities/kis_paper_private/daily
      - --head-cache-root
      - /app/market_data/us_equities/kis_paper_private/daily-head/v1
      - --availability-root
      - /app/model_artifacts/_control/kis-paper-daily-spy-input-availability-v1
      - --state-root
      - /app/private/canary
      - --runtime-projection
      - /app/runtime/state/kis_paper_canary.json
      - --paper-account-snapshot
      - /app/runtime/state/paper_account_snapshot.json
      - --emergency-state
      - /app/emergency/emergency_state.json
      - --execution-control
      - /app/emergency/paper_execution_control.json
      - --artifact-root
      - /app/model_artifacts
    environment:
      THERICHER_MODE: kis_paper
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - thericher-v2-paper-canary-private:/app/private
      - thericher-v2-web-emergency:/app/emergency
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-receipt-observer:
    build:
      context: .
      target: base
    profiles: ["kis-paper-receipt-observer"]
    command:
      - /bin/sh
      - -ec
      - >-
        exec python -m thericher_v2.execution.kis_paper_receipt_observer
        --execute --run-id "$${KIS_PAPER_RECEIPT_RUN_ID}"
        --state-root /app/private/canary --artifact-root /app/model_artifacts
        --repository-root /app
    environment:
      THERICHER_MODE: kis_paper
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-paper-canary-private:/app/private:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-terminal-field-probe:
    build:
      context: .
      target: base
    profiles: ["kis-paper-terminal-field-probe"]
    command:
      - /bin/sh
      - -ec
      - >-
        exec python -m thericher_v2.execution.kis_paper_terminal_field_probe
        --execute --run-id "$${KIS_PAPER_TERMINAL_PROBE_RUN_ID}"
        --state-root /app/private/canary --artifact-root /app/model_artifacts
        --repository-root /app
    environment:
      THERICHER_MODE: kis_paper
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-paper-canary-private:/app/private:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-paper-intraday-cache:
    build:
      context: .
      target: base
    profiles: ["kis-paper-intraday-cache"]
    command:
      - python
      - scripts/backfill_kis_paper_private_intraday.py
      - --execute
      - --pages-per-target
      - "2"
      - --runtime-projection
      - /app/runtime/state/kis_paper_intraday_freshness.json
    environment:
      THERICHER_MODE: off
      THERICHER_MARKET_DATA_ROOT: /market_data
      PYTHONPATH: /app/src
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
    volumes:
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/market_data
      - thericher-v2-runtime:/app/runtime

  kis-paper-intraday-head:
    build:
      context: .
      target: base
    profiles: ["kis-paper-intraday-head"]
    command:
      - python
      - scripts/backfill_kis_paper_private_intraday.py
      - --execute
      - --mode
      - head
      - --pages-per-target
      - "4"
      - --preparation-artifact-root
      - /app/model_artifacts
      - --runtime-projection
      - /app/runtime/state/kis_paper_intraday_freshness.json
    environment:
      THERICHER_MODE: off
      THERICHER_MARKET_DATA_ROOT: /market_data
      THERICHER_MODEL_ARTIFACT_ROOT: ${THERICHER_MODEL_ARTIFACT_ROOT:-/app/model_artifacts}
      PYTHONPATH: /app/src
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
    volumes:
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/market_data
      - thericher-v2-runtime:/app/runtime
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

volumes:
  thericher-v2-runtime:
  thericher-v2-web-emergency:
  thericher-v2-paper-canary-private:
