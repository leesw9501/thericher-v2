services:
  engine:
    build:
      context: .
      target: base
    command:
      - python
      - -m
      - thericher_v2.ops.daily_report
      - --print-summary
    environment:
      THERICHER_MODE: off
      THERICHER_REPO_ROOT: /app
      THERICHER_MARKET_DATA_ROOT: /app/market_data
      THERICHER_RUNTIME_STATUS: /app/runtime/operator_status.json
      PYTHONPATH: /app/src
    volumes:
      # An explicitly invoked engine/local-simulation job may write this named runtime.
      # The default daily-report command does not produce local-paper events.
      - thericher-v2-runtime:/app/runtime
      - ./reports:/app/reports
      - ./NEXT_CODEX_GOAL.md:/app/NEXT_CODEX_GOAL.md:ro
      - ./agents:/app/agents:ro
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro

  web:
    build:
      context: .
      target: base
    command:
      - python
      - -m
      - thericher_v2.dashboard.server
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --emergency-state
      - /app/emergency/emergency_state.json
      - --paper-account-snapshot
      - /app/runtime/state/paper_account_snapshot.json
    environment:
      THERICHER_MODE: off
      THERICHER_DASHBOARD_TOKEN: ${THERICHER_DASHBOARD_TOKEN:-}
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # This monitor reads Docker-local state and writes emergency state separately.
      - thericher-v2-runtime:/app/runtime:ro
      - thericher-v2-web-emergency:/app/emergency

  research:
    build:
      context: .
      target: research
    profiles: ["research"]
    network_mode: none
    read_only: true
    gpus: all
    tmpfs:
      - /tmp
    command:
      - python
      - -m
      - thericher_v2.ops.daily_report
      - --print-summary
    environment:
      THERICHER_MODE: off
      THERICHER_REPO_ROOT: /app
      THERICHER_MARKET_DATA_ROOT: /app/market_data
      THERICHER_RUNTIME_STATUS: /app/runtime/operator_status.json
      PYTHONPATH: /app/src
      NVIDIA_VISIBLE_DEVICES: all
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      THERICHER_MODEL_ARTIFACT_ROOT: ${THERICHER_MODEL_ARTIFACT_ROOT:-/app/model_artifacts}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - ./data:/app/data
      - ./reports:/app/reports
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./NEXT_CODEX_GOAL.md:/app/NEXT_CODEX_GOAL.md:ro
      - ./agents:/app/agents:ro
      - ${THERICHER_HOST_MARKET_DATA_ROOT:-D:/market_data}:/app/market_data:ro
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  kis-readonly:
    build:
      context: .
      target: base
    profiles: ["kis-readonly"]
    command:
      - python
      - -m
      - thericher_v2.execution.kis_paper_console_bridge
      - --execute
      - --repository-root
      - /app
      - --runtime-snapshot
      - /app/runtime/state/paper_account_snapshot.json
    environment:
      THERICHER_MODE: off
      THERICHER_MODEL_ARTIFACT_ROOT: /app/model_artifacts
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-}
    volumes:
      - thericher-v2-runtime:/app/runtime
      - ${THERICHER_HOST_MODEL_ARTIFACT_ROOT:-D:/thericher-v2/model-artifacts}:/app/model_artifacts

  paper-capital-proposal:
    build:
      context: .
      target: base
    profiles: ["paper-capital-proposal"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    command:
      - python
      - -m
      - thericher_v2.execution.paper_capital_proposal
      - --runtime-snapshot
      - /app/runtime/state/paper_account_snapshot.json
    environment:
      THERICHER_MODE: off
      PYTHONPATH: /app/src
    volumes:
      - thericher-v2-runtime:/app/runtime:ro

volumes:
  thericher-v2-runtime:
  thericher-v2-web-emergency:
