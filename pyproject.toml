[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thericher-v2"
version = "0.1.0"
description = "Engine-first KIS trading workstation v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas-market-calendars==5.4.0",
]

[project.optional-dependencies]
dev = [
  "numpy>=2.0",
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "ruff>=0.5",
  "scikit-learn>=1.7,<2",
]
research = [
  "chronos-forecasting==2.2.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.7,<2",
]
norgate-host = [
  "norgatedata==1.0.77",
]

[project.scripts]
thericher-v2-daily-report = "thericher_v2.ops.daily_report:main"
thericher-v2-dashboard = "thericher_v2.dashboard.server:main"
thericher-v2-data-agent = "thericher_v2.data.agent:main"
thericher-v2-engine-research-agent = "thericher_v2.research.engine_research_agent:main"
thericher-v2-experiment-queue = "thericher_v2.research.experiments:main"
thericher-v2-gpu-compute-smoke = "thericher_v2.research.gpu_compute:main"
thericher-v2-gpu-runtime-smoke = "thericher_v2.research.gpu_runtime:main"
thericher-v2-gpu-training-smoke = "thericher_v2.research.gpu_training:main"
thericher-v2-research-job = "thericher_v2.research.jobs:main"
thericher-v2-validation-smoke = "thericher_v2.research.validation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/thericher_v2"]
